# see bootstrap.sh for a way to set everything up
# https://github.com/joshlong/mise

min_version = "2026.9.11"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "java"]

[tools]
# Java and Node remain here when configured; other Brew-managed tools live in
# Brewfile so Homebrew is the single package manager for them.
node = "24.18.0"
java = ["25", "zulu-8", "21", "27"]

[dotfiles]
"~/.gitconfig" = { source = "dotfiles/.gitconfig", mode = "symlink" }
"~/.aliases" = { source = "dotfiles/.aliases", mode = "symlink" }
"~/.functions" = { source = "dotfiles/.functions", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/.zshrc", mode = "symlink" }
"~/.zshenv" = { source = "dotfiles/.zshenv", mode = "symlink" }
"~/.m2/settings.xml" = { source = "dotfiles/settings.xml", mode = "symlink" }


[tasks.bootstrap]
description = "使用 Brewfile 安装 Homebrew 软件"
run = '''
if [[ "$(uname -s)" == "Darwin" ]]; then
  HOMEBREW_NO_AUTO_UPDATE=1 brew bundle install --file '{{ config_root }}/Brewfile' --no-upgrade --verbose
else
  echo "当前系统不是 macOS，跳过 Brewfile"
fi
'''
